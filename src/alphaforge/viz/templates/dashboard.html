<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlphaForge 组合仪表盘</title>
  <script src="/static/vendor/echarts.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #0f172a; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; }
    .chart-box { width: 100%; }
  </style>
</head>
<body class="text-gray-100 p-6">
  <div class="max-w-7xl mx-auto">
    <!-- 顶栏 -->
    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-2xl font-bold">AlphaForge 组合仪表盘</h1>
        <p id="report-date" class="text-gray-400 text-sm mt-1">加载中...</p>
      </div>
      <div class="flex items-center gap-3">
        <select id="date-selector" class="bg-slate-700 text-sm px-3 py-2 rounded-lg border border-slate-600">
          <option value="">最新报告</option>
        </select>
        <a href="/attribution" class="bg-cyan-600 hover:bg-cyan-500 px-4 py-2 rounded-lg text-sm">归因分析</a>
        <a href="/backtest" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-lg text-sm">回测明细</a>
      </div>
    </div>

    <!-- KPI 卡片 -->
    <div id="kpi-grid" class="grid grid-cols-2 md:grid-cols-4 xl:grid-cols-7 gap-4 mb-6"></div>

    <!-- 权益曲线 + 回撤 -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-6">
      <div class="card p-4 lg:col-span-2">
        <h3 class="font-semibold mb-2">权益曲线</h3>
        <div id="equity-chart" class="chart-box" style="height:360px"></div>
      </div>
      <div class="card p-4">
        <h3 class="font-semibold mb-2">回撤水下</h3>
        <div id="drawdown-chart" class="chart-box" style="height:360px"></div>
      </div>
    </div>

    <!-- 持仓 + 行业 -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-6">
      <div class="card p-4">
        <h3 class="font-semibold mb-2">持仓分布</h3>
        <div id="positions-chart" class="chart-box" style="height:320px"></div>
      </div>
      <div class="card p-4">
        <h3 class="font-semibold mb-2">行业暴露</h3>
        <div id="industry-chart" class="chart-box" style="height:320px"></div>
      </div>
      <div class="card p-4">
        <h3 class="font-semibold mb-2">风险预警</h3>
        <div id="alerts-box" class="space-y-3"></div>
        <h3 class="font-semibold mt-4 mb-2">操作建议</h3>
        <div id="recs-box" class="space-y-2"></div>
      </div>
    </div>

    <!-- 选股打分策略回测（嵌入） -->
    <div class="card p-4 mt-6">
      <div class="flex items-center justify-between mb-3">
        <h3 class="font-semibold text-lg">选股打分策略回测</h3>
        <span id="scoring-period" class="text-gray-400 text-xs"></span>
      </div>
      <div id="scoring-error" class="text-amber-400 text-sm hidden"></div>

      <!-- 选股回测 KPI -->
      <div id="scoring-kpi" class="grid grid-cols-2 md:grid-cols-4 xl:grid-cols-8 gap-3 mb-4"></div>

      <!-- 净值 + 回撤 -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-4">
        <div class="lg:col-span-2">
          <div class="text-gray-400 text-xs mb-1">组合净值（归一化 1000）</div>
          <div id="scoring-equity" style="height:300px"></div>
        </div>
        <div>
          <div class="text-gray-400 text-xs mb-1">回撤水下</div>
          <div id="scoring-drawdown" style="height:300px"></div>
        </div>
      </div>

      <!-- 交易记录 -->
      <div class="text-gray-400 text-xs mb-1">交易记录</div>
      <div id="scoring-trades" class="overflow-x-auto mb-3"></div>

      <!-- 候选池 -->
      <div class="text-gray-400 text-xs mb-1">候选池（<span id="scoring-pool-count">0</span> 只）</div>
      <div id="scoring-pool" class="overflow-x-auto"></div>
    </div>

    <p class="text-gray-500 text-xs text-center mt-8">AlphaForge 自动生成 · 仅供复盘参考</p>
  </div>

  <script>
    // ---------- 工具 ----------
    function fmtPct(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
    function colorOf(v) { return v >= 0 ? '#34d399' : '#f87171'; }

    // ---------- KPI 渲染 ----------
    function renderKPI(kpi) {
      const cards = [
        { label: '累计收益', value: fmtPct(kpi.total_return), color: colorOf(kpi.total_return) },
        { label: '年化收益', value: fmtPct(kpi.annualized), color: colorOf(kpi.annualized) },
        { label: '最大回撤', value: fmtPct(kpi.max_drawdown), color: colorOf(kpi.max_drawdown) },
        { label: '夏普比率', value: kpi.sharpe.toFixed(2), color: kpi.sharpe >= 0.5 ? '#34d399' : '#fbbf24' },
        { label: '胜率', value: kpi.win_rate.toFixed(1) + '%', color: '#60a5fa' },
        { label: '年化波动', value: kpi.volatility.toFixed(1) + '%', color: '#c084fc' },
        { label: '期末净值', value: '¥' + (kpi.final_nav/10000).toFixed(1) + '万', color: '#fbbf24' },
      ];
      document.getElementById('kpi-grid').innerHTML = cards.map(c => `
        <div class="card p-4">
          <div class="text-gray-400 text-xs">${c.label}</div>
          <div class="text-2xl font-bold mt-1" style="color:${c.color}">${c.value}</div>
        </div>`).join('');
    }

    // ---------- ECharts 初始化 ----------
    function initEquity(equity) {
      const chart = echarts.init(document.getElementById('equity-chart'), 'dark');
      const labels = equity.dates;
      const nav = equity.nav.map(v => Math.round(v));
      const first = nav[0] || 1000000;
      const normalized = nav.map(v => +(v/first*1000).toFixed(1)); // 归一化到 1000
      chart.setOption({
        tooltip: { trigger: 'axis' },
        grid: { left: 60, right: 20, top: 20, bottom: 40 },
        xAxis: { type: 'category', data: labels, axisLine: { lineStyle: { color: '#475569' } } },
        yAxis: { type: 'value', axisLabel: { formatter: v => (v/10).toFixed(1) }, splitLine: { lineStyle: { color: '#1e293b' } } },
        series: [{
          name: '组合净值', type: 'line', data: normalized, smooth: true,
          symbol: 'none', lineStyle: { width: 3, color: '#22d3ee' },
          areaStyle: { color: new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(34,211,238,0.3)'},{offset:1,color:'rgba(34,211,238,0)'}]) }
        }]
      });
    }

    function initDrawdown(dd) {
      const chart = echarts.init(document.getElementById('drawdown-chart'), 'dark');
      chart.setOption({
        tooltip: { trigger: 'axis', valueFormatter: v => v.toFixed(2) + '%' },
        grid: { left: 50, right: 20, top: 20, bottom: 40 },
        xAxis: { type: 'category', data: dd.dates, axisLine: { lineStyle: { color: '#475569' } } },
        yAxis: { type: 'value', axisLabel: { formatter: v => v + '%' }, splitLine: { lineStyle: { color: '#1e293b' } } },
        series: [{ name: '回撤', type: 'line', data: dd.values, smooth: true, symbol: 'none',
          lineStyle: { color: '#f87171' },
          areaStyle: { color: 'rgba(248,113,113,0.4)' } }]
      });
    }

    function initPositions(positions) {
      const chart = echarts.init(document.getElementById('positions-chart'), 'dark');
      chart.setOption({
        tooltip: { trigger: 'item', formatter: '{b}: {c}%' },
        series: [{
          type: 'pie', radius: ['35%', '70%'], label: { show: true, formatter: '{b}\n{d}%' },
          data: positions.map(p => ({ name: p.name || p.code, value: +p.pct.toFixed(2) }))
        }]
      });
    }

    function initIndustry(industries) {
      const chart = echarts.init(document.getElementById('industry-chart'), 'dark');
      chart.setOption({
        tooltip: { trigger: 'axis' },
        grid: { left: 40, right: 20, top: 20, bottom: 40 },
        xAxis: { type: 'value', splitLine: { lineStyle: { color: '#1e293b' } } },
        yAxis: { type: 'category', data: industries.map(i => i.industry) },
        series: [{ type: 'bar', data: industries.map(i => +i.pct.toFixed(2)), barWidth: 20,
          itemStyle: { color: '#a78bfa', borderRadius: 4 } }]
      });
    }

    // ---------- 预警与建议 ----------
    function renderAlerts(alerts) {
      const box = document.getElementById('alerts-box');
      if (!alerts || alerts.length === 0) {
        box.innerHTML = '<div class="text-emerald-400 text-sm">✓ 无触发预警</div>';
        return;
      }
      const colors = { HIGH: 'bg-red-500/20 text-red-300 border-red-600', MEDIUM: 'bg-amber-500/20 text-amber-300 border-amber-600', LOW: 'bg-yellow-500/20 text-yellow-300 border-yellow-600' };
      box.innerHTML = alerts.map(a => `<div class="p-2 rounded-lg border text-xs ${colors[a.level]||''}">${a.message}</div>`).join('');
    }

    function renderRecs(recs) {
      const box = document.getElementById('recs-box');
      if (!recs || recs.length === 0) { box.innerHTML = '<div class="text-gray-400 text-sm">暂无建议</div>'; return; }
      box.innerHTML = recs.map(r => `<div class="p-2 rounded-lg border border-slate-600 text-xs">
        <div class="font-semibold">[${r.priority}] ${r.title}</div>
        ${r.description ? `<div class="text-gray-400 mt-1">${r.description}</div>` : ''}
      </div>`).join('');
    }

    // ---------- 加载 ----------
    async function loadDashboard() {
      try {
        const date = document.getElementById('date-selector').value;
        const resp = await fetch('/api/dashboard' + (date ? '?date=' + date : ''));
        const data = await resp.json();
        if (data.error) { document.getElementById('report-date').innerText = data.error; return; }
        document.getElementById('report-date').innerText = '数据来源：output/ · 报告日期 ' + (data.dates[data.dates.length-1] || '');
        renderKPI(data.kpi);
        initEquity(data.equity_curve);
        initDrawdown(data.drawdown);
        initPositions(data.positions);
        initIndustry(data.industry_exposure);
        renderAlerts(data.alerts);
        renderRecs(data.recommendations);
      } catch (e) { document.getElementById('report-date').innerText = '加载失败：' + e.message; }
      // 加载选股打分策略回测（嵌入区块）
      loadScoring();
    }

    // ---------- 选股打分策略回测（嵌入区块） ----------
    async function loadScoring() {
      try {
        const r = await fetch('/api/scoring');
        const d = await r.json();
        const errBox = document.getElementById('scoring-error');
        if (d.error) {
          errBox.textContent = '⚠ ' + d.error;
          errBox.classList.remove('hidden');
          return;
        }
        errBox.classList.add('hidden');
        document.getElementById('scoring-period').innerText =
          `${d.start_date} ~ ${d.end_date}（${d.days}天 | 候选池${d.pool_size}只）`;
        renderScoringKPI(d.kpi, d.benchmark);
        initScoringEquity(d.equity_curve);
        initScoringDrawdown(d.drawdown);
        renderScoringTrades(d.trades);
        renderScoringPool(d.pool_stocks);
      } catch (e) {
        document.getElementById('scoring-error').textContent = '选股回测加载失败：' + e.message;
        document.getElementById('scoring-error').classList.remove('hidden');
      }
    }

    function renderScoringKPI(kpi, bench) {
      const cards = [
        { label: '总收益', value: fmtPct(kpi.total_return), color: colorOf(kpi.total_return) },
        { label: '年化', value: fmtPct(kpi.annualized), color: colorOf(kpi.annualized) },
        { label: '最大回撤', value: fmtPct(kpi.max_drawdown), color: colorOf(kpi.max_drawdown) },
        { label: '夏普', value: kpi.sharpe.toFixed(2), color: kpi.sharpe >= 1 ? '#34d399' : (kpi.sharpe >= 0 ? '#fbbf24' : '#f87171') },
        { label: '胜率', value: kpi.win_rate.toFixed(1) + '%', color: '#60a5fa' },
        { label: '盈亏比', value: kpi.profit_loss_ratio.toFixed(2), color: '#a78bfa' },
        { label: '成交', value: kpi.total_trades + '笔', color: '#fbbf24' },
        { label: '超额vs沪深300', value: fmtPct((bench.excess_return||0)*100), color: colorOf((bench.excess_return||0)*100) },
      ];
      document.getElementById('scoring-kpi').innerHTML = cards.map(c => `
        <div class="bg-slate-800 rounded-lg p-2">
          <div class="text-gray-400 text-xs">${c.label}</div>
          <div class="text-lg font-bold mt-1" style="color:${c.color}">${c.value}</div>
        </div>`).join('');
    }

    function initScoringEquity(eq) {
      const dom = document.getElementById('scoring-equity');
      echarts.dispose(dom);
      const chart = echarts.init(dom, 'dark');
      chart.setOption({
        tooltip: { trigger: 'axis' },
        grid: { left: 50, right: 15, top: 15, bottom: 30 },
        xAxis: { type: 'category', data: eq.dates, axisLine: { lineStyle: { color: '#475569' } } },
        yAxis: { type: 'value', splitLine: { lineStyle: { color: '#1e293b' } } },
        series: [{ type: 'line', data: eq.nav, smooth: true, symbol: 'none',
          lineStyle: { width: 2, color: '#22d3ee' },
          areaStyle: { color: new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(34,211,238,0.3)'},{offset:1,color:'rgba(34,211,238,0)'}]) } }]
      });
    }

    function initScoringDrawdown(dd) {
      const dom = document.getElementById('scoring-drawdown');
      echarts.dispose(dom);
      const chart = echarts.init(dom, 'dark');
      chart.setOption({
        tooltip: { trigger: 'axis', valueFormatter: v => v.toFixed(2) + '%' },
        grid: { left: 45, right: 15, top: 15, bottom: 30 },
        xAxis: { type: 'category', data: dd.dates, axisLine: { lineStyle: { color: '#475569' } } },
        yAxis: { type: 'value', axisLabel: { formatter: v => v + '%' }, splitLine: { lineStyle: { color: '#1e293b' } } },
        series: [{ type: 'line', data: dd.values, smooth: true, symbol: 'none',
          lineStyle: { color: '#f87171' }, areaStyle: { color: 'rgba(248,113,113,0.4)' } }]
      });
    }

    function renderScoringTrades(trades) {
      const box = document.getElementById('scoring-trades');
      if (!trades || trades.length === 0) { box.innerHTML = '<div class="text-gray-400 text-sm py-2">无成交记录</div>'; return; }
      const rows = trades.map(t => {
        const c = t.side === 'BUY' ? 'text-emerald-400' : 'text-rose-400';
        return `<tr class="border-t border-slate-700 text-sm">
          <td class="p-2">${t.date}</td><td class="p-2 ${c} font-semibold">${t.side}</td>
          <td class="p-2">${t.code}</td><td class="p-2 text-right">${t.qty}</td>
          <td class="p-2 text-right">${t.price.toFixed(2)}</td>
          <td class="p-2 text-xs text-gray-400">${t.reason||''}</td></tr>`;
      }).join('');
      box.innerHTML = `<table class="w-full text-sm"><thead><tr class="text-gray-400">
        <th class="p-2 text-left">日期</th><th class="p-2 text-left">方向</th><th class="p-2 text-left">代码</th>
        <th class="p-2 text-right">数量</th><th class="p-2 text-right">价格</th><th class="p-2 text-left">理由</th>
      </tr></thead><tbody>${rows}</tbody></table>`;
    }

    function renderScoringPool(stocks) {
      const box = document.getElementById('scoring-pool');
      document.getElementById('scoring-pool-count').textContent = (stocks||[]).length;
      if (!stocks || stocks.length === 0) { box.innerHTML = '<div class="text-gray-400 text-sm py-2">无候选池</div>'; return; }
      const rows = stocks.map((s, i) => `<tr class="border-t border-slate-700 text-sm">
        <td class="p-2">${i+1}</td><td class="p-2">${s.code}</td>
        <td class="p-2">${s.name||''}</td><td class="p-2">${s.industry||''}</td></tr>`
      ).join('');
      box.innerHTML = `<table class="w-full text-sm"><thead><tr class="text-gray-400">
        <th class="p-2 text-left">#</th><th class="p-2 text-left">代码</th>
        <th class="p-2 text-left">名称</th><th class="p-2 text-left">行业</th>
      </tr></thead><tbody>${rows}</tbody></table>`;
    }

    async function loadDates() {
      try {
        const resp = await fetch('/api/dates');
        const data = await resp.json();
        const sel = document.getElementById('date-selector');
        sel.innerHTML = '<option value="">最新报告</option>' +
          data.dates.map(d => `<option value="${d}">${d}</option>`).join('');
      } catch (e) {}
    }

    document.getElementById('date-selector').addEventListener('change', loadDashboard);
    loadDates();
    loadDashboard();
    // 窗口 resize 时只重绘图表，不重新加载数据
    let _resizeTimer = null;
    window.addEventListener('resize', () => {
      if (_resizeTimer) clearTimeout(_resizeTimer);
      _resizeTimer = setTimeout(() => {
        document.querySelectorAll('[id$="-chart"]').forEach(el => {
          const inst = echarts.getInstanceByDom(el);
          if (inst) inst.resize();
        });
      }, 200);
    });
  </script>
</body>
</html>
